name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs cancel; manual runs stay independent.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Required checks stay on fast GitHub-hosted hardware.
    runs-on: ubuntu-latest
    # Expected quick tier: 6-10 minutes, with headroom for install and runner variance.
    timeout-minutes: 25
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout must precede this first decision. NUL delimiters handle unusual
      # filenames; compare the actual PR endpoints, not the synthetic merge commit.
      # Disable rename folding so moving source into docs still counts its deletion.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.jsx|.agents/pm/*.ts|.agents/pm/*.tsx|.agents/pm/*.mts|.agents/pm/*.cts|.agents/pm/*.sh|.agents/pm/extensions/*) code=true ;;
                docs/*.mjs|docs/*.cjs|docs/*.js|docs/*.jsx|docs/*.ts|docs/*.tsx|docs/*.mts|docs/*.cts|docs/*.sh) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        run: ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Verify generated changelog
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        run: npm run changelog:check

      - name: Verify release workflow contract
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run verify:release-workflow

      - name: Build and verify committed output is current
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Engines floor build and tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      # Packed fixture scripts cover Bun global installs and bunx execution,
      # but are not part of release:check. Keep an explicit smoke here.
      - name: Bun and bunx smoke
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          bun --version
          bun install --no-save
          bunx --no-install tsc --noEmit
